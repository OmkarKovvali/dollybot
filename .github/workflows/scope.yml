name: Coordination
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  scope:
    name: Task scope
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check assignment and changed paths
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          BRANCH: ${{ github.head_ref }}
        run: |
          git show "$BASE:coordination/check.py" > "$RUNNER_TEMP/check.py"
          python3 "$RUNNER_TEMP/check.py" "$BASE" "$HEAD" "$BRANCH"
